name: 🧪 End-to-end tests
description: 'Installs dependencies, builds the app, and runs Playwright end-to-end tests.'

inputs:
  url:
    required: false
    type: string
  auth-bypass-token:
    required: false
    type: string

runs:
  using: 'composite'
  steps:
    - name: 📥 Install dependencies
      shell: 'bash'
      run: npm ci

    - name: 🔑 Write .env for local preview server
      shell: bash
      run: |
        if [ -z "$SESSION_SECRET" ]; then
          echo "⚠️  SESSION_SECRET not set — E2E tests require GitHub secrets to be configured."
          echo "SKIP_E2E=true" >> "$GITHUB_ENV"
        else
          printf '%s\n' \
            "SESSION_SECRET=$SESSION_SECRET" \
            "PUBLIC_STOREFRONT_API_TOKEN=$PUBLIC_STOREFRONT_API_TOKEN" \
            "PRIVATE_STOREFRONT_API_TOKEN=$PRIVATE_STOREFRONT_API_TOKEN" \
            "PUBLIC_STORE_DOMAIN=$PUBLIC_STORE_DOMAIN" \
            "PUBLIC_STOREFRONT_ID=$PUBLIC_STOREFRONT_ID" \
            "PUBLIC_CUSTOMER_ACCOUNT_API_CLIENT_ID=$PUBLIC_CUSTOMER_ACCOUNT_API_CLIENT_ID" \
            "PUBLIC_CUSTOMER_ACCOUNT_API_URL=$PUBLIC_CUSTOMER_ACCOUNT_API_URL" \
            "PUBLIC_CHECKOUT_DOMAIN=$PUBLIC_CHECKOUT_DOMAIN" \
            "SHOP_ID=$SHOP_ID" \
            > .env
        fi

    - name: 📦 Build
      shell: 'bash'
      if: env.SKIP_E2E != 'true'
      run: SHOPIFY_HYDROGEN_FLAG_LOCKFILE_CHECK=false npm run build

    - name: 💾 Turbo cache
      id: turbo-cache
      uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
      with:
        path: |
          node_modules/.cache/turbo
          **/.turbo
        key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ github.job }}-${{ github.ref_name }}-

    - name: 📄 Get installed Playwright version
      shell: 'bash'
      run: echo "PLAYWRIGHT_VERSION=$(npm ls @playwright/test | grep @playwright -m 1 | sed 's/.*@//')"  >> $GITHUB_ENV

    - name: 💾 Cache Playwright binaries
      uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

    - name: 💽 Install Playwright Browsers (all)
      shell: 'bash'
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: 💽 Install Playwright (only system deps)
      shell: 'bash'
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: 🍄 Run Playwright tests
      shell: 'bash'
      if: env.SKIP_E2E != 'true'
      run: URL=${{ inputs.url }} AUTH_BYPASS_TOKEN=${{ inputs.auth-bypass-token }} npx playwright test

    - name: 🗒 Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: playwright-report
        path: ./playwright-report/
        retention-days: 30
